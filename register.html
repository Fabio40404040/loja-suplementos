<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register</title>
        <link rel="stylesheet" href="./src/styles/register.css">
    </head>
    <body class="register-page">
        
        <div class="register-page">
            <form  id="registerForm">
                <div class="container">
                    <h1>Cadastre-se</h1>
                    <p>Preencha este formulário para criar uma conta.</p>
                    <hr>
                    <label for="email"><b>Email</b></label>
                    <input
                    type="text" 
                    placeholder="Digite o e-mail" 
                    name="email" id="email" 
                    required>

                    <label for="psw"><b>Senha</b></label>
                    <div class="password-wrapper">
                        <input 
                        type="password"
                        placeholder="Digite a senha" 
                        name="psw" id="psw" 
                        minlength="8"
                        pattern="(?=.*[A-Z])(?=.*[^A-Za-z0-9 ]).{8,}"
                        title="Use no mínimo 8 caracteres, uma letra maiúscula e um caractere especial."
                        autocomplete="new-password"
                        required>
                        <button 
                            type="button" 
                            class="toggle-password" 
                            aria-label="Mostrar senha">
                            <i 
                                class="fa-regular fa-eye" 
                                style="color: rgb(26, 25, 24);">
                            </i>
                        </button>
                    </div>
                    <small class="password-requirements">Mínimo de 8 caracteres, uma letra maiúscula e um caractere especial.</small>
                    <label for="psw-repeat"><b>Repita a Senha</b></label>
                    <div class="password-wrapper">
                        <input 
                        type="password" 
                        placeholder="Repita a Senha" 
                        name="psw-repeat" 
                        id="psw-repeat" 
                        minlength="8"
                        autocomplete="new-password"
                        required>
                        <button 
                            type="button" 
                            class="toggle-password" 
                            aria-label="Mostrar senha">
                            <i 
                                class="fa-regular fa-eye" 
                                style="color: rgb(26, 25, 24);">
                            </i>
                        </button>
                    </div>
                    <hr>

                    <div class="terms">
                        <label>
                            <input 
                                type="checkbox" 
                                id="terms" 
                                name="terms" 
                                required
                            >


                            <span>
                                Ao criar uma conta, você concorda com nossos 
                                <a href="./termos.html" target="_blank">
                                    Termos e Política de Privacidade 
                                </a>.
                            </span>
                        
                        </label>
                    </div>

                    <button 
                        type="submit" 
                        class="registerbtn">Cadastre-se
                    </button>
                    <p id="message"></p>
                </div>
                <div class="container signin">
                    <p>
                        Já tem uma conta?
                        <a href="./login.html">
                            Iniciar sessão
                        </a>.
                    </p>
                </div>
            </form>
        </div>


        <script type="module" src="./src/main.js"></script>
    </body>
</html>
